# repos-16.0.yaml — réplica Mecan (Odoo 16.0). 40 repos OCA, punta de rama 16.0.
# git-aggregator clona cada repo en /opt/oca/<name> (el Dockerfile lo mete al addons_path).
#
# NOTA: antes iba pineado por commit, pero GitHub NO sirve fetch de un SHA suelto que
# no sea punta de rama (git-aggregator hace `git fetch oca <sha>` -> couldn't find remote
# ref -> build falla). Para el objetivo (replicar Mecan y migrar a 17/18) no hace falta el
# commit exacto: el dump lleva los datos, el código solo debe existir y ser 16.0-compatible.
# Se usa la punta de 16.0 (más robusto y mejor base para migrar). Los SHAs originales del
# servidor viejo quedan en el historial git (commit anterior) por si hiciera falta.

/opt/oca/account-analytic:
  defaults: {depth: 1}
  remotes: {oca: https://github.com/OCA/account-analytic.git}
  target: oca 16.0
  merges: [oca 16.0]
