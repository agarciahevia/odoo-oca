# repos-16.0.yaml — réplica Mecan (Odoo 16.0). 40 repos OCA, commit pineado por repo.
# git-aggregator clona cada repo en /opt/oca/<name> (el Dockerfile lo mete al addons_path).
# Sin shallow a propósito: se fetchea un commit histórico concreto.
#
# ⚠ 5 repos tenían módulos a commits DISTINTOS en el servidor viejo. Un checkout es
# un solo estado, así que van pineados al commit dominante; revisar la versión de sus
# módulos tras el arranque (o clonar por grupos si alguno falla):
#   account-financial-reporting  -> 63312bab13 (revisar: account_financial_report a7afb37784,
#                                    account_financial_report_sale 730ff967b0, account_tax_balance 75af1138b7)
#   account-invoicing            -> 0e2f4d622b (revisar: account_invoice_pricelist b4cfae9eca,
#                                    account_invoice_section_sale_order ad87c4eafc)
#   account-reconcile            -> 30e501bf0e (revisar: account_statement_base 24e0d4104e)
#   l10n-spain                   -> 4b0f92a812 (revisar: l10n_es_aeat 6609532751, l10n_es_dua_igic baf489c36c,
#                                    l10n_es_facturae 5476efdce8, l10n_es_vat_book b569d9f07b, l10n_es_vat_book_igic 82189590bf)
#   reporting-engine             -> cb3c9ae852 (revisar: report_xlsx 8261a11102, report_xml c51cebf492)

